name: "Conditional Routing with CEL"
description: "Uses CEL-based selector to route based on classified intent"
version: "1.0"

nodes:
  # First, classify the intent using an LLM
  - id: "classify_intent"
    type: "generate"
    model: "gpt-4o"
    system_prompt: |
      Classify the user's intent into exactly one word:
      - "question" if they're asking something
      - "task" if they want something done
      - "chat" for general conversation

      Respond with ONLY one of these three words: question, task, or chat
    next: "route_by_intent"

  # Then route based on the classification using CEL
  - id: "route_by_intent"
    type: "selector"
    cases:
      - if: "nodes.classify_intent.output.toLowerCase().contains('question')"
        next: "answer_question"
      - if: "nodes.classify_intent.output.toLowerCase().contains('task')"
        next: "handle_task"
      - if: "nodes.classify_intent.output.toLowerCase().contains('chat')"
        next: "casual_chat"
      - if: "true"  # Default case
        next: "casual_chat"

  - id: "answer_question"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "Provide a clear, factual answer to the user's question."
    temperature: 0.3
    next: "closing"

  - id: "handle_task"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "Help the user accomplish their task with step-by-step instructions."
    temperature: 0.5
    next: "closing"

  - id: "casual_chat"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "Engage in friendly, casual conversation."
    temperature: 0.9
    next: "closing"

  - id: "closing"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "Wrap up the conversation politely."
    temperature: 0.7
