name: "Multi-Step Conversation"
description: "A complex conversation flow with multiple generate nodes"
version: "1.0"

nodes:
  - id: "greeting"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "You are a friendly AI assistant. Greet the user warmly."
    temperature: 0.7
    next: "understand_intent"

  - id: "understand_intent"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "Analyze the user's request and summarize what they want in one sentence."
    temperature: 0.3
    next: "provide_response"

  - id: "provide_response"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "Provide a helpful and detailed response to the user's request."
    temperature: 0.7
    next: "followup"

  - id: "followup"
    type: "generate"
    model: "gpt-4o"
    system_prompt: "Ask if the user needs any clarification or has follow-up questions."
    temperature: 0.8
